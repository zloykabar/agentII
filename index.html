<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИИ-Агент</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3;
    --muted:#8b949e; --accent:#2f81f7; --user:#1f6feb; --assistant:#21262d;
    --success:#3fb950; --error:#f85149;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
  header{padding:12px 20px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:12px;background:var(--panel)}
  header h1{font-size:16px;font-weight:600}
  header .status{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:20px;
    background:var(--border);color:var(--muted)}
  header .status.ready{color:var(--success)}
  #chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:820px;padding:12px 16px;border-radius:10px;line-height:1.55;
    white-space:pre-wrap;word-wrap:break-word;font-size:14.5px}
  .msg.user{align-self:flex-end;background:var(--user);color:#fff}
  .msg.assistant{align-self:flex-start;background:var(--assistant);border:1px solid var(--border)}
  .msg.system{align-self:center;background:transparent;border:1px dashed var(--border);
    color:var(--muted);font-size:12.5px;font-style:italic}
  .msg code{background:rgba(110,118,129,.25);padding:2px 5px;border-radius:4px;
    font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px}
  .msg pre{background:#0d1117;border:1px solid var(--border);padding:10px;
    border-radius:6px;overflow-x:auto;margin:8px 0}
  .msg pre code{background:none;padding:0}
  .typing{display:inline-block}
  .typing::after{content:'▋';animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  footer{padding:14px 20px;border-top:1px solid var(--border);background:var(--panel)}
  .input-row{display:flex;gap:10px;max-width:900px;margin:0 auto}
  #input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:12px 14px;border-radius:8px;font-family:inherit;font-size:14.5px;
    resize:none;max-height:200px;min-height:46px}
  #input:focus{outline:none;border-color:var(--accent)}
  button{background:var(--accent);color:#fff;border:none;padding:0 20px;border-radius:8px;
    font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s}
  button:hover:not(:disabled){opacity:.85}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0 12px}
  .hint{max-width:900px;margin:8px auto 0;font-size:11.5px;color:var(--muted);text-align:center}
</style>
</head>
<body>

<header>
  <h1>🤖 ИИ-Агент</h1>
  <span class="status" id="status">Не настроен</span>
  <button class="ghost" id="settingsBtn">⚙️ API</button>
  <button class="ghost" id="clearBtn">🗑️ Очистить</button>
</header>

<div id="chat"></div>

<footer>
  <div class="input-row">
    <textarea id="input" placeholder="Спросите что-нибудь… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
    <button id="sendBtn">Отправить</button>
  </div>
  <div class="hint">Ключи хранятся только в localStorage вашего браузера.</div>
</footer>

<script>
/* ============================================================
   ИИ-Агент с поддержкой прокси
   ============================================================ */

const CONFIG_KEY  = 'ai_agent_config';
const HISTORY_KEY = 'ai_agent_history';

const DEFAULT_CONFIG = {
  endpoint: '',              // полный URL, например https://proxy.workers.dev/v1/chat/completions
  apiKey: '',
  proxySecret: '',           // если задан в Worker'е
  model: 'gpt-4o-mini',
  systemPrompt: 'Ты — полезный ИИ-ассистент. Отвечай кратко и по делу. Используй markdown для кода.',
  temperature: 0.7,
};

let config  = { ...DEFAULT_CONFIG };
let history = [];
let isBusy  = false;

const $chat       = document.getElementById('chat');
const $input      = document.getElementById('input');
const $sendBtn    = document.getElementById('sendBtn');
const $status     = document.getElementById('status');
const $settingsBtn= document.getElementById('settingsBtn');
const $clearBtn   = document.getElementById('clearBtn');

/* ---------- Хранилище ---------- */
function loadState() {
  try {
    const c = JSON.parse(localStorage.getItem(CONFIG_KEY));
    if (c && typeof c === 'object') config = { ...DEFAULT_CONFIG, ...c };
  } catch {}
  try {
    const h = JSON.parse(localStorage.getItem(HISTORY_KEY));
    if (Array.isArray(h)) history = h;
  } catch {}
}
function saveConfig()  { localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); updateStatus(); }
function saveHistory() { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }

/* ---------- UI ---------- */
function updateStatus() {
  if (config.apiKey && config.endpoint) {
    let host = config.endpoint;
    try { host = new URL(config.endpoint).host; } catch {}
    $status.textContent = `● ${config.model} @ ${host}`;
    $status.classList.add('ready');
  } else {
    $status.textContent = 'Не настроен (⚙️ API)';
    $status.classList.remove('ready');
  }
}

function appendMessage(role, content, opts = {}) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = renderMarkdown(content);
  if (opts.typing) { div.classList.add('typing'); div.innerHTML = ''; div.textContent = content; }
  $chat.appendChild(div);
  $chat.scrollTop = $chat.scrollHeight;
  return div;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function renderMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code}</code></pre>`);
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return html;
}

/* ---------- Настройка ---------- */
function openSettings() {
  const endpoint = prompt(
    'Endpoint (полный URL chat/completions).\n\n' +
    'Пример с прокси:\nhttps://my-proxy.you.workers.dev/v1/chat/completions\n\n' +
    'Пример напрямую (может ловить CORS):\nhttps://api.openai.com/v1/chat/completions',
    config.endpoint || 'https://api.openai.com/v1/chat/completions'
  );
  if (endpoint === null) return;

  const apiKey = prompt('API Key (sk-...):', config.apiKey);
  if (apiKey === null) return;

  const proxySecret = prompt(
    'Proxy Secret (заголовок X-Proxy-Secret).\nОставьте пустым, если в Worker не задан:',
    config.proxySecret
  );
  if (proxySecret === null) return;

  const model = prompt('Модель:', config.model);
  if (model === null) return;

  const systemPrompt = prompt('Системный промпт:', config.systemPrompt);
  if (systemPrompt === null) return;

  config = {
    ...config,
    endpoint:    endpoint.trim(),
    apiKey:      apiKey.trim(),
    proxySecret: proxySecret.trim(),
    model:       model.trim(),
    systemPrompt:systemPrompt.trim(),
  };
  saveConfig();
  appendMessage('system', '✅ Настройки сохранены.');
}

/* ---------- Отправка ---------- */
async function sendMessage() {
  if (isBusy) return;
  const text = $input.value.trim();
  if (!text) return;

  if (!config.endpoint || !config.apiKey) {
    appendMessage('system', '⚠️ Заполните Endpoint и API Key в настройках (⚙️ API).');
    openSettings();
    return;
  }

  $input.value = '';
  $input.style.height = 'auto';
  appendMessage('user', text);
  history.push({ role: 'user', content: text });
  saveHistory();

  isBusy = true;
  $sendBtn.disabled = true;
  const typingEl = appendMessage('assistant', 'Думает…', { typing: true });

  try {
    const messages = [
      { role: 'system', content: config.systemPrompt },
      ...history.slice(-20),
    ];

    const headers = { 'Content-Type': 'application/json' };
    if (config.apiKey)     headers['Authorization']  = `Bearer ${config.apiKey}`;
    if (config.proxySecret) headers['X-Proxy-Secret'] = config.proxySecret;

    let res;
    try {
      res = await fetch(config.endpoint, {
        method: 'POST',
        headers,
        body: JSON.stringify({
          model: config.model,
          messages,
          temperature: config.temperature,
        }),
      });
    } catch (netErr) {
      throw new Error(
        'Сеть недоступна или запрос заблокирован (CORS).\n' +
        'Проверьте: 1) Endpoint указывает на ваш Worker-прокси; ' +
        '2) Worker развёрнут и URL верный; 3) нет блокировщика рекламы.\n' +
        'Техническая деталь: ' + netErr.message
      );
    }

    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      let detail = errText.slice(0, 500);
      try { detail = JSON.stringify(JSON.parse(errText).error || JSON.parse(errText), null, 2); } catch {}
      throw new Error(`HTTP ${res.status}\n${detail}`);
    }

    const data = await res.json();
    const reply = data?.choices?.[0]?.message?.content?.trim() || '(пустой ответ)';

    typingEl.remove();
    appendMessage('assistant', reply);
    history.push({ role: 'assistant', content: reply });
    saveHistory();

  } catch (err) {
    typingEl.remove();
    appendMessage('system', `❌ Ошибка: ${err.message}`);
  } finally {
    isBusy = false;
    $sendBtn.disabled = false;
    $input.focus();
  }
}

/* ---------- События ---------- */
$sendBtn.addEventListener('click', sendMessage);
$input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 200) + 'px';
});
$settingsBtn.addEventListener('click', openSettings);
$clearBtn.addEventListener('click', () => {
  if (!confirm('Очистить всю историю диалога?')) return;
  history = []; saveHistory(); $chat.innerHTML = '';
  appendMessage('system', 'История очищена.');
});

/* ---------- Старт ---------- */
loadState();
updateStatus();

if (history.length === 0) {
  appendMessage('system', 'Привет! Настройте API через ⚙️. Для GitHub Pages нужен прокси-URL воркера.');
} else {
  history.forEach(m => appendMessage(m.role, m.content));
}
$input.focus();
</script>
</body>
</html>
