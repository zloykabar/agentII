<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИИ-Агент</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;
    --muted:#8b949e;--accent:#2f81f7;--user:#1f6feb;--assistant:#21262d;
    --success:#3fb950;--error:#f85149;--warn:#d29922}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
  header{padding:12px 20px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:10px;background:var(--panel);flex-wrap:wrap}
  header h1{font-size:16px;font-weight:600}
  header .status{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:20px;
    background:var(--border);color:var(--muted);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:340px}
  header .status.ready{color:var(--success)}
  #chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:820px;padding:12px 16px;border-radius:10px;line-height:1.55;
    white-space:pre-wrap;word-wrap:break-word;font-size:14.5px}
  .msg.user{align-self:flex-end;background:var(--user);color:#fff}
  .msg.assistant{align-self:flex-start;background:var(--assistant);border:1px solid var(--border)}
  .msg.system{align-self:center;background:transparent;border:1px dashed var(--border);
    color:var(--muted);font-size:12.5px;font-style:italic;max-width:100%}
  .msg.error{border-color:var(--error);color:#ffb3ae}
  .msg.ok{border-color:var(--success);color:#7ee787}
  .msg code{background:rgba(110,118,129,.25);padding:2px 5px;border-radius:4px;
    font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px}
  .msg pre{background:#0d1117;border:1px solid var(--border);padding:10px;
    border-radius:6px;overflow-x:auto;margin:8px 0;font-size:12.5px}
  .msg pre code{background:none;padding:0}
  .typing{display:inline-block}
  .typing::after{content:'▋';animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  footer{padding:14px 20px;border-top:1px solid var(--border);background:var(--panel)}
  .input-row{display:flex;gap:10px;max-width:900px;margin:0 auto}
  #input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);
    padding:12px 14px;border-radius:8px;font-family:inherit;font-size:14.5px;
    resize:none;max-height:200px;min-height:46px}
  #input:focus{outline:none;border-color:var(--accent)}
  button{background:var(--accent);color:#fff;border:none;padding:0 16px;border-radius:8px;
    font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s;height:46px}
  button:hover:not(:disabled){opacity:.85}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0 12px}
  .hint{max-width:900px;margin:8px auto 0;font-size:11.5px;color:var(--muted);text-align:center}
</style>
</head>
<body>

<header>
  <h1>🤖 ИИ-Агент</h1>
  <span class="status" id="status">Не настроен</span>
  <button class="ghost" id="testBtn">🔌 Проверить</button>
  <button class="ghost" id="settingsBtn">⚙️ API</button>
  <button class="ghost" id="clearBtn">🗑️</button>
</header>

<div id="chat"></div>

<footer>
  <div class="input-row">
    <textarea id="input" placeholder="Спросите что-нибудь… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
    <button id="sendBtn">Отправить</button>
  </div>
  <div class="hint">Ключи хранятся только в localStorage. Нажмите 🔌 Проверить для диагностики.</div>
</footer>

<script>
const CONFIG_KEY  = 'ai_agent_config';
const HISTORY_KEY = 'ai_agent_history';

const DEFAULT_CONFIG = {
  endpoint: '',
  apiKey: '',
  proxySecret: '',
  model: 'gpt-4o-mini',
  systemPrompt: 'Ты — полезный ИИ-ассистент. Отвечай кратко и по делу. Используй markdown для кода.',
  temperature: 0.7,
};

let config  = { ...DEFAULT_CONFIG };
let history = [];
let isBusy  = false;

const $chat = document.getElementById('chat');
const $input = document.getElementById('input');
const $sendBtn = document.getElementById('sendBtn');
const $status = document.getElementById('status');
const $settingsBtn = document.getElementById('settingsBtn');
const $clearBtn = document.getElementById('clearBtn');
const $testBtn = document.getElementById('testBtn');

/* ---------- Хранилище ---------- */
function loadState() {
  try { const c = JSON.parse(localStorage.getItem(CONFIG_KEY)); if (c) config = { ...DEFAULT_CONFIG, ...c }; } catch {}
  try { const h = JSON.parse(localStorage.getItem(HISTORY_KEY)); if (Array.isArray(h)) history = h; } catch {}
}
function saveConfig(){ localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); updateStatus(); }
function saveHistory(){ localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }

/* ---------- UI ---------- */
function updateStatus() {
  if (config.apiKey && config.endpoint) {
    let host = config.endpoint;
    try { host = new URL(config.endpoint).host; } catch {}
    $status.textContent = `● ${config.model} @ ${host}`;
    $status.classList.add('ready');
    $status.title = config.endpoint;
  } else {
    $status.textContent = 'Не настроен (⚙️ API)';
    $status.classList.remove('ready');
    $status.title = '';
  }
}

function appendMessage(role, content, opts = {}) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (opts.kind === 'error') div.classList.add('error');
  if (opts.kind === 'ok') div.classList.add('ok');
  div.innerHTML = renderMarkdown(content);
  if (opts.typing) { div.classList.add('typing'); div.innerHTML = ''; div.textContent = content; }
  $chat.appendChild(div);
  $chat.scrollTop = $chat.scrollHeight;
  return div;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderMarkdown(text) {
  let h = escapeHtml(String(text));
  h = h.replace(/```([\s\S]*?)```/g, (_, c) => `<pre><code>${c}</code></pre>`);
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return h;
}

/* ---------- Нормализация URL ---------- */
function normalizeEndpoint(raw) {
  let u = (raw || '').trim();
  if (!u) return '';
  // без протокола — добавим https
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  // убираем хвостовые слэши
  u = u.replace(/\/+$/, '');
  // если это чистый домен или workers.dev без пути — дописываем путь
  try {
    const url = new URL(u);
    if (!url.pathname || url.pathname === '/') {
      u += '/v1/chat/completions';
    }
  } catch {}
  return u;
}

/* ---------- Настройки ---------- */
function openSettings() {
  const endpoint = prompt(
    'Endpoint (полный URL chat/completions).\n\n' +
    'Пример с Worker-прокси:\nhttps://my-proxy.you.workers.dev/v1/chat/completions\n\n' +
    'Если забудете /v1/chat/completions — допишется автоматически.',
    config.endpoint || ''
  );
  if (endpoint === null) return;

  const apiKey = prompt('API Key (sk-...):', config.apiKey);
  if (apiKey === null) return;

  const proxySecret = prompt('Proxy Secret (если задан в Worker):', config.proxySecret);
  if (proxySecret === null) return;

  const model = prompt('Модель:', config.model);
  if (model === null) return;

  const systemPrompt = prompt('Системный промпт:', config.systemPrompt);
  if (systemPrompt === null) return;

  config = {
    ...config,
    endpoint: normalizeEndpoint(endpoint),
    apiKey: apiKey.trim(),
    proxySecret: proxySecret.trim(),
    model: model.trim(),
    systemPrompt: systemPrompt.trim(),
  };
  saveConfig();
  appendMessage('system', `✅ Сохранено. Endpoint: ${config.endpoint}`, { kind: 'ok' });
}

/* ---------- Диагностика ---------- */
async function runDiagnostics() {
  $testBtn.disabled = true;
  appendMessage('system', '🔍 Запуск диагностики…');

  // 1. Конфиг
  if (!config.endpoint) {
    appendMessage('system',
      '❌ Шаг 1/4: Endpoint не задан.\nНажмите ⚙️ API и введите URL вашего Worker + /v1/chat/completions.',
      { kind: 'error' });
    $testBtn.disabled = false; return;
  }
  appendMessage('system', `✅ Шаг 1/4: Endpoint = ${config.endpoint}`, { kind: 'ok' });

  // 2. Пинг воркера (GET на корень)
  let base;
  try { base = new URL(config.endpoint).origin; } catch {
    appendMessage('system', `❌ Шаг 2/4: Endpoint не является корректным URL: "${config.endpoint}"`, { kind: 'error' });
    $testBtn.disabled = false; return;
  }
  try {
    const r = await withTimeout(fetch(base, { method: 'GET' }), 8000);
    const text = await r.text();
    let info = null; try { info = JSON.parse(text); } catch {}
    if (r.ok && info && info.ok) {
      appendMessage('system',
        `✅ Шаг 2/4: Worker отвечает.\nTarget: ${info.target}\nSecret required: ${info.secret_required}`,
        { kind: 'ok' });
      if (info.secret_required && !config.proxySecret) {
        appendMessage('system',
          '⚠️ Worker требует X-Proxy-Secret, но в настройках агента он пуст. Проверка ключа упадёт с 401.',
          { kind: 'error' });
      }
    } else if (r.status === 404 || r.status === 405) {
      appendMessage('system',
        `⚠️ Шаг 2/4: Worker отвечает ${r.status} на GET. Это нормально, если Worker старый (без ping).\nПроверка продолжится.`,
        { kind: 'ok' });
    } else {
      appendMessage('system',
        `⚠️ Шаг 2/4: GET ${base} → HTTP ${r.status}.\nТело: ${text.slice(0, 300)}\nВозможно, это не Worker или другая служба.`,
        { kind: 'error' });
    }
  } catch (e) {
    appendMessage('system',
      `❌ Шаг 2/4: Не удалось достучаться до ${base}\n${e.message}\n\n` +
      'Проверьте:\n• Worker развёрнут (Save and deploy)\n• URL полностью совпадает с тем, что показывает Cloudflare\n' +
      '• нет блокировщика рекламы/прокси на домене workers.dev',
      { kind: 'error' });
    $testBtn.disabled = false; return;
  }

  // 3. Ключ
  if (!config.apiKey) {
    appendMessage('system', '❌ Шаг 3/4: API Key пуст. Нажмите ⚙️ API.', { kind: 'error' });
    $testBtn.disabled = false; return;
  }
  appendMessage('system',
    `✅ Шаг 3/4: API Key задан (${config.apiKey.slice(0,6)}…${config.apiKey.slice(-4)})`,
    { kind: 'ok' });

  // 4. Тестовый запрос
  appendMessage('system', '⏳ Шаг 4/4: отправляю тестовый запрос в модель…');
  try {
    const res = await callApi([
      { role: 'system', content: 'Отвечай одним словом.' },
      { role: 'user', content: 'Скажи "ок".' },
    ], 20000);
    appendMessage('system',
      `✅ Шаг 4/4: Модель ответила: "${res.slice(0, 200)}"\nВсё работает — можно общаться.`,
      { kind: 'ok' });
  } catch (e) {
    appendMessage('system', `❌ Шаг 4/4: ${e.message}`, { kind: 'error' });
  } finally {
    $testBtn.disabled = false;
  }
}

/* ---------- Утилиты ---------- */
function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, rej) => setTimeout(() => rej(new Error(`Таймаут ${ms}мс`)), ms)),
  ]);
}

/* Основной вызов API. Возвращает строку ответа или бросает понятную ошибку. */
async function callApi(messages, timeoutMs = 60000) {
  const headers = { 'Content-Type': 'application/json' };
  if (config.apiKey) headers['Authorization'] = `Bearer ${config.apiKey}`;
  if (config.proxySecret) headers['X-Proxy-Secret'] = config.proxySecret;

  let res;
  try {
    res = await withTimeout(fetch(config.endpoint, {
      method: 'POST',
      headers,
      body: JSON.stringify({
        model: config.model,
        messages,
        temperature: config.temperature,
      }),
    }), timeoutMs);
  } catch (e) {
    throw new Error(
      `Не удалось выполнить fetch: ${e.message}\n` +
      `Endpoint: ${config.endpoint}\n\n` +
      'Возможные причины:\n' +
      '• Опечатка в URL Endpoint (сравните с URL воркера в Cloudflare)\n' +
      '• Worker не развёрнут / удалён\n' +
      '• Блокировщик рекламы или расширение режет запрос к workers.dev\n' +
      '• Нет интернета или DNS не резолвит домен'
    );
  }

  const text = await res.text();
  let data = null; try { data = JSON.parse(text); } catch {}

  if (!res.ok) {
    const detail = data ? JSON.stringify(data.error || data, null, 2) : text.slice(0, 500);
    let hint = '';
    if (res.status === 401) hint = '\n\n→ Проверьте API Key и совпадение Proxy Secret с переменной Worker.';
    else if (res.status === 403) hint = '\n\n→ Ключ не имеет доступа к модели или регион заблокирован.';
    else if (res.status === 404) hint = '\n\n→ Неверный путь Endpoint. Должно быть /v1/chat/completions.';
    else if (res.status === 429) hint = '\n\n→ Превышен лимит запросов или закончились средства на аккаунте.';
    else if (res.status >= 500) hint = '\n\n→ Ошибка на стороне провайдера или Worker. Посмотрите логи Worker в Cloudflare (Real-time Logs).';
    throw new Error(`HTTP ${res.status}${hint}\n\n${detail}`);
  }

  const reply = data?.choices?.[0]?.message?.content?.trim();
  if (!reply) {
    throw new Error(`Пустой ответ от модели. Полный JSON:\n${text.slice(0, 600)}`);
  }
  return reply;
}

/* ---------- Отправка сообщения ---------- */
async function sendMessage() {
  if (isBusy) return;
  const text = $input.value.trim();
  if (!text) return;

  if (!config.endpoint || !config.apiKey) {
    appendMessage('system', '⚠️ Сначала настройте API (⚙️) и проверьте кнопкой 🔌.', { kind: 'error' });
    openSettings();
    return;
  }

  $input.value = '';
  $input.style.height = 'auto';
  appendMessage('user', text);
  history.push({ role: 'user', content: text });
  saveHistory();

  isBusy = true;
  $sendBtn.disabled = true;
  $testBtn.disabled = true;
  const typingEl = appendMessage('assistant', 'Думает…', { typing: true });

  try {
    const messages = [
      { role: 'system', content: config.systemPrompt },
      ...history.slice(-20),
    ];
    const reply = await callApi(messages, 60000);

    typingEl.remove();
    appendMessage('assistant', reply);
    history.push({ role: 'assistant', content: reply });
    saveHistory();
  } catch (err) {
    typingEl.remove();
    appendMessage('system', `❌ ${err.message}`, { kind: 'error' });
  } finally {
    isBusy = false;
    $sendBtn.disabled = false;
    $testBtn.disabled = false;
    $input.focus();
  }
}

/* ---------- События ---------- */
$sendBtn.addEventListener('click', sendMessage);
$input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 200) + 'px';
});
$settingsBtn.addEventListener('click', openSettings);
$testBtn.addEventListener('click', runDiagnostics);
$clearBtn.addEventListener('click', () => {
  if (!confirm('Очистить историю?')) return;
  history = []; saveHistory(); $chat.innerHTML = '';
  appendMessage('system', 'История очищена.');
});

/* ---------- Старт ---------- */
loadState();
updateStatus();

if (history.length === 0) {
  appendMessage('system',
    'Привет! Порядок:\n1) ⚙️ API — введите Endpoint воркера и ключ\n2) 🔌 Проверить — диагностика\n3) Общайтесь');
} else {
  history.forEach(m => appendMessage(m.role, m.content));
}
$input.focus();
</script>
</body>
</html>
